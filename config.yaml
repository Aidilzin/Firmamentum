roles:
  planner:  [claude:opus, claude:sonnet]
  scout:    [agy:default]            # agy:default = agy with no --model
  builder:  [claude:sonnet]          # builder and repair: claude only
  reviewer: [claude:opus, claude:sonnet, agy:default]
  repair:   [claude:sonnet]
cooldown_minutes: 60
approval_rules:
  - merge_to_main
  - delete_outside_worktree
  - touches_auth_payments_secrets_env
  - db_migration_or_schema
  - new_dependency
  - tests_fail_after_3_repairs
  - tests_removed
  - plan_needs_input
  - all_agents_rate_limited
review: per_step          # per_step | off
max_repair_rounds: 3
repos:
  orch: { path: ".", test_command: "uv run pytest -q", retest_command: "uv run pytest -q --lf" }
