[project]
name = "orch"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Everine", email = "aidilzin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.28.0",
]

[project.scripts]
orch = "orch.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
